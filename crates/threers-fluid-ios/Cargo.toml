[package]
name = "threers-fluid-ios"
version = "0.0.7"
edition = "2021"
authors = ["Eugene Hauptmann"]
description = "The threers volumetric fluid as a C ABI static library, for iOS and iPadOS"
license = "MIT"
repository = "https://github.com/eugenehp/threers"
homepage = "https://github.com/eugenehp/threers"
readme = "README.md"
keywords = ["fluid", "ios", "metal", "wgpu", "graphics"]
categories = ["graphics", "api-bindings"]
# Linked into an app bundle, not published.
publish = false

[lib]
name = "threers_fluid_ios"
# `staticlib` is what Xcode links; `cdylib` is for a framework target or for
# loading it from a test harness on the host.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
threers = { path = "../..", default-features = false, features = ["fluid"] }
pollster = "0.3"
wgpu = "30"

# macOS only, and only for the tests: `CAMetalLayer` is the same class on both
# platforms, so the iOS entry points can be driven for real on a development
# Mac rather than only compiled for the device.
# The host harness is an example, so these are dev-dependencies.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
