[package]
name = "threers-swipe-web"
version.workspace = true
edition = "2024"
authors = ["Eugene Hauptmann"]
description = "Gesture typing and next-word predictions on the threers on-screen keyboard, in the browser"
license = "MIT"
repository = "https://github.com/eugenehp/threers"
# A demo, not a library. See docs/releasing.md.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
threers-ui = { path = "../threers-ui", default-features = false, features = ["swipe"] }
# No `parallel`: a page decodes on its one thread.
threers-swipe = { path = "../threers-swipe", default-features = false, features = ["keyboard", "ngram", "rlx"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "console"]
