[package]
name = "threers-mechanism-tour"
version = "0.0.1"
edition = "2021"
authors = ["Eugene Hauptmann"]
description = "The threers-physics mechanism tour in a browser: a .scad model that declares its own joints, assembled, checked, simulated and verified on screen"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
threers = { path = "../..", features = ["openscad", "assembly-check"] }
threers-physics = { path = "../threers-physics", features = ["assembly", "openscad"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[[example]]
name = "console"
