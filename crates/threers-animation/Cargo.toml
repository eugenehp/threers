[package]
name = "threers-animation"
version = "0.0.1"
edition = "2021"
# Matches `threers`, which this depends on.
rust-version = "1.87"
authors = ["Eugene Hauptmann"]
description = "Tweens, springs, timelines and cinematic camera animation for threers — fly, orbit, paths, shake and shot lists, plus blending an animated pose into a simulated one"
license = "MIT"
readme = "README.md"
repository = "https://github.com/eugenehp/threers"
homepage = "https://github.com/eugenehp/threers"
documentation = "https://docs.rs/threers-animation"
keywords = ["animation", "tween", "easing", "camera", "three-js"]
categories = ["game-development", "graphics", "multimedia"]

[features]
default = []
# `blend` — driving a simulated ragdoll from an animated pose and back. Optional
# because easing, tweens, springs and timelines need no simulation at all.
physics = ["dep:threers-physics"]

# The only example that needs the solver. Without this cargo builds it for a
# bare `--all-targets` and it fails on the missing `threers_physics`.
[[example]]
name = "anim_physics_blend"
required-features = ["physics"]

[dependencies]
threers = { path = "../..", version = "0.0.8" }
threers-physics = { path = "../threers-physics", version = "0.0.8", optional = true }
