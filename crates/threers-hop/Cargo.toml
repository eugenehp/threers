[package]
name = "threers-hop"
version.workspace = true
edition = "2024"
rust-version = "1.99"
publish = false
description = "The `hop` example from threers-ecs, as a browser package"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# rayon in the browser: a nightly build with atomics, on a cross-origin isolated page.
threads = ["threers-ecs/web-threads", "dep:rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
rayon = { version = "1", optional = true }
threers = { path = "../..", features = ["webgl"] }
threers-ecs = { path = "../threers-ecs", features = ["physics", "audio", "web"] }
threers-physics = { path = "../threers-physics" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
