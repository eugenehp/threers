<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0c0c10}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c10);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(3, 4, 5);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.5);
rim.position.set(-4, 1, -2);
scene.add(rim);
const mats = [
    { color: 0xd0d0d0, metalness: 1, roughness: 0.35, anisotropy: 0.8, anisotropyRotation: 0 },
    { color: 0xd0d0d0, metalness: 1, roughness: 0.35, anisotropy: 0.8, anisotropyRotation: Math.PI / 2 },
    { color: 0xd0d0d0, metalness: 1, roughness: 0.35, anisotropy: 0.5, anisotropyRotation: Math.PI / 4 },];
mats.forEach((m, i) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.95, 64, 32), new THREE.MeshPhysicalMaterial(m));
    s.position.x = (i - 1) * 2.2;
    scene.add(s);
});
const cam = new THREE.PerspectiveCamera(40, 800/600, 0.1, 100);
cam.position.set(0, 0.4, 7.5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
