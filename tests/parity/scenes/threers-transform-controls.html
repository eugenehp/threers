<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers, TransformControls } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const canvas = document.getElementById('c');
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101418);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(2.6, 2.1, 3.4); cam.lookAt(0, 0, 0);
const boxA = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshBasicMaterial({ color: 0x556677 }));
boxA.position.set(-0.7, 0, 0.2); boxA.rotation.set(0.3, 0.5, 0);
const boxB = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshBasicMaterial({ color: 0x665566 }));
boxB.position.set(0.9, 0.1, -0.4); boxB.rotation.set(-0.2, 0.7, 0.1);
scene.add(boxA, boxB);
const tA = new TransformControls(cam, canvas);
tA.attach(boxA); scene.add(tA);
const tB = new TransformControls(cam, canvas);
tB.setMode('rotate'); tB.setSpace('local'); tB.setSize(0.8);
tB.attach(boxB); scene.add(tB);
        const r = await THREE.WebGLRenderer.create(canvas);
        r.setSize(800, 600);
        window.__tc = { scene, cam, r, tA, tB, boxA, boxB };
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
