<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers, FontLoader, TextGeometry } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101418);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const dl = new THREE.DirectionalLight(0xffffff, 1.1); dl.position.set(1, 2, 3); scene.add(dl);
const font = await new FontLoader().loadAsync('/web/node_modules/three/examples/fonts/helvetiker_regular.typeface.json');
const geo = new TextGeometry('Ag&8?', { font, size: 0.5, depth: 0.12, curveSegments: 6,
    bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015, bevelSegments: 3 });
const text = new THREE.Mesh(geo, [new THREE.MeshStandardMaterial({ color: 0xffcc66, roughness: 0.4 }),
    new THREE.MeshStandardMaterial({ color: 0x5588ff, roughness: 0.6 })]);
text.position.set(-0.95, -0.15, 0);
text.rotation.y = -0.35;
scene.add(text);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0.4, 2.4); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
