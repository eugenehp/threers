<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101820}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
// Physical spheres lit only by image-based light: the scene's environment (a
// marked cube, turned and dimmed by environmentRotation / environmentIntensity),
// a material's own envMap at its own intensity, and an envMapRotation.
function face(fill, mark) {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = fill; g.fillRect(0, 0, 64, 64);
    g.fillStyle = mark; g.fillRect(4, 4, 24, 24);
    g.fillStyle = '#000'; g.fillRect(40, 40, 20, 20);
    return c;
}
function cubeOf(fills) {
    const t = new THREE.CubeTexture(fills.map(([f, m]) => face(f, m)));
    t.colorSpace = THREE.SRGBColorSpace;
    t.needsUpdate = true;
    return t;
}
const room = cubeOf([['#d33', '#fff'], ['#3d3', '#ff0'], ['#33d', '#0ff'], ['#dd3', '#f0f'], ['#d3d', '#fff'], ['#3dd', '#f80']]);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);
scene.environment = room;
scene.environmentRotation = new THREE.Euler(0, 0.6, 0);
const geo = new THREE.SphereGeometry(0.62, 64, 32);
const put = (opts, x, y) => { const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial(opts)); m.position.set(x, y, 0); scene.add(m); };
put({ color: 0x202040, roughness: 0.8, sheen: 1, sheenColor: 0xffd0a0, sheenRoughness: 0.35 }, -1.4, 0.7);
put({ color: 0x202020, roughness: 0.15, iridescence: 1, iridescenceIOR: 1.4, iridescenceThicknessRange: [100, 380] }, 0, 0.7);
put({ color: 0xffffff, metalness: 1, roughness: 0.3, anisotropy: 0.9, anisotropyRotation: 0.4 }, 1.4, 0.7);
put({ color: 0xc03020, roughness: 0.7, clearcoat: 1, clearcoatRoughness: 0.05 }, -1.4, -0.7);
put({ color: 0x3050a0, roughness: 0.2, ior: 2.0, specularIntensity: 0.4, specularColor: 0xffa040 }, 0, -0.7);
put({ color: 0x406040, roughness: 0.6, sheen: 0.8, sheenColor: 0xffffff, sheenRoughness: 0.6, clearcoat: 0.6, clearcoatRoughness: 0.3 }, 1.4, -0.7);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
