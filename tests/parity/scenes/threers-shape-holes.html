<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101418}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers, FontLoader, TextGeometry } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101418);
scene.add(new THREE.AmbientLight(0xffffff, 0.45));
const dl = new THREE.DirectionalLight(0xffffff, 1); dl.position.set(2, 3, 4); scene.add(dl);
const s = new THREE.Shape();
s.moveTo(0, 0); s.lineTo(2, 0); s.quadraticCurveTo(3, 0.5, 2.5, 1.5);
s.bezierCurveTo(2.2, 2.5, 1.0, 2.8, 0.5, 2.0);
s.splineThru([new THREE.Vector2(0.2, 1.6), new THREE.Vector2(-0.4, 1.2), new THREE.Vector2(-0.3, 0.6)]);
s.absellipse(-0.5, 0.3, 0.4, 0.25, 0.3, 4.0, true, 0.2);
s.closePath();
const hole = new THREE.Path(); hole.absarc(1.2, 1.0, 0.35, 0, Math.PI * 2, false); s.holes.push(hole);
const hole2 = new THREE.Path(); hole2.moveTo(1.8, 0.3); hole2.lineTo(2.1, 0.3); hole2.lineTo(1.95, 0.6); s.holes.push(hole2);
const ex = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.4, bevelThickness: 0.1, bevelSize: 0.08, bevelSegments: 2, curveSegments: 8 }),
    [new THREE.MeshStandardMaterial({ color: 0x66ccaa }), new THREE.MeshStandardMaterial({ color: 0xcc6688 })]);
ex.scale.setScalar(0.5); ex.position.set(-1.6, -0.2, 0); ex.rotation.set(-0.4, 0.5, 0);
scene.add(ex);
const tri = new THREE.Shape([new THREE.Vector2(0, 0.5), new THREE.Vector2(-0.5, -0.5), new THREE.Vector2(0.5, -0.5)]);
const sq = new THREE.Shape(); sq.moveTo(0.7, -0.5); sq.lineTo(1.5, -0.5); sq.lineTo(1.5, 0.3); sq.lineTo(0.7, 0.3); sq.closePath();
const sqHole = new THREE.Path(); sqHole.absellipse(1.1, -0.1, 0.2, 0.12, 0, Math.PI * 2, false, 0.5); sq.holes.push(sqHole);
const flat = new THREE.Mesh(new THREE.ShapeGeometry([tri, sq], 10),
    [new THREE.MeshBasicMaterial({ color: 0xffaa33, side: THREE.DoubleSide }), new THREE.MeshBasicMaterial({ color: 0x3399ff, side: THREE.DoubleSide })]);
flat.position.set(0.2, 0.5, 0);
scene.add(flat);
const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(-1, -1, 0), new THREE.Vector3(-0.2, -0.6, 0.4), new THREE.Vector3(0.6, -1.1, 0.2), new THREE.Vector3(1.4, -0.7, -0.3)]);
const small = new THREE.Shape([new THREE.Vector2(0, 0.08), new THREE.Vector2(-0.08, -0.08), new THREE.Vector2(0.08, -0.08)]);
scene.add(new THREE.Mesh(new THREE.ExtrudeGeometry(small, { steps: 40, extrudePath: curve }), new THREE.MeshStandardMaterial({ color: 0xdddd55 })));
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 4); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
