<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#000}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x203040);
        const near = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0xff4422 }));
        near.position.set(-1.0, -0.3, 2); scene.add(near);
        const focus = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 16), new THREE.MeshBasicMaterial({ color: 0xeeeeee }));
        scene.add(focus);
        const far = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.3, 16, 48), new THREE.MeshBasicMaterial({ color: 0x22cc66 }));
        far.position.set(2.5, 1.0, -6); scene.add(far);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 5); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        const composer = new THREE.EffectComposer(r);
        composer.addPass(new THREE.RenderPass(scene, cam));
        composer.addPass(new THREE.BokehPass(scene, cam, { focus: 5.0, aperture: 0.01, maxblur: 0.03 }));
        await composer.render(0);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display = 'block';
        errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
