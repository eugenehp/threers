<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#101820}canvas{display:block}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101820);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const dl = new THREE.DirectionalLight(0xffffff, 1.6);
dl.position.set(2, 3, 4);
scene.add(dl);
function checker(a, b) {
    const d = new Uint8Array(8 * 8 * 4);
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
        const c = (x + y) % 2 ? a : b, i = (y * 8 + x) * 4;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    const t = new THREE.DataTexture(d, 8, 8, THREE.RGBAFormat);
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
    t.needsUpdate = true;
    return t;
}
const colourMap = checker([230, 120, 40], [40, 160, 220]);
colourMap.colorSpace = THREE.SRGBColorSpace;
const aoMap = checker([255, 255, 255], [60, 60, 60]);
const glowMap = checker([255, 40, 40], [0, 0, 0]);
glowMap.colorSpace = THREE.SRGBColorSpace;
const geo = new THREE.PlaneGeometry(1.4, 1.4);
const lambert = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: colourMap }));
lambert.position.set(-1.6, 0, 0);
scene.add(lambert);
const phong = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color: 0xdddddd, aoMap, aoMapIntensity: 1, shininess: 40 }));
scene.add(phong);
const toon = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ color: 0x334455, emissive: 0xffffff, emissiveMap: glowMap }));
toon.position.set(1.6, 0, 0);
scene.add(toon);
const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
cam.position.set(0, 0, 5); cam.lookAt(0, 0, 0);
const r = new THREE.WebGLRenderer({ canvas, antialias: false });
r.setSize(800, 600, false); r.setPixelRatio(1);
r.render(scene, cam);
document.body.dataset.ready = 'true';
</script></body></html>
