<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#161618}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x161618);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dl = new THREE.DirectionalLight(0xffffff, 0.7);
        dl.position.set(2, 3, 4);
        scene.add(dl);
        const target = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.MeshStandardMaterial({ color: 0x445566, roughness: 0.6 }));
        target.position.set(0.1, 0, 0);
        target.rotation.set(0.2, 0.3, 0);
        scene.add(target);
        target.updateMatrixWorld(true);
        const decal = new THREE.DecalGeometry(target, new THREE.Vector3(0.3, 0.3, 0.85), new THREE.Euler(0.2, 0.4, 0.3, 'XYZ'), new THREE.Vector3(1.1, 0.8, 1.2));
        const dm = new THREE.Mesh(decal, new THREE.MeshBasicMaterial({ color: 0xff4466, polygonOffset: true, polygonOffsetFactor: -4 }));
        scene.add(dm);
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 0, 4); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(document.getElementById('c'));
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
