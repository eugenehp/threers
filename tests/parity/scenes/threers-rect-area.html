<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>body{margin:0;background:#0c0c10}canvas{display:block}#err{position:absolute;top:0;left:0;padding:12px;color:#fdd;background:#500;font-family:monospace;white-space:pre-wrap}</style></head>
<body><canvas id="c" width="800" height="600"></canvas>
<div id="err" style="display:none"></div>
<script type="module">
import THREE, { initThreers } from '/web/threejs-shim.js';
const errEl = document.getElementById('err');
(async () => {
    try {
        await initThreers('/web/pkg/threers_bg.wasm');
        const canvas = document.getElementById('c');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x101014);
        // LTC tables, as three.js requires before a RectAreaLight shades.
        THREE.RectAreaLightUniformsLib.init();
        const warm = new THREE.RectAreaLight(0xffb070, 6, 2.5, 1.2);
        warm.position.set(-2.2, 2.0, 2.5);
        warm.lookAt(0, 0, 0);
        scene.add(warm);
        // A scaled, rolled light: three.js takes its matrix's rotation alone, so the
        // scale must not stretch the panel.
        const cool = new THREE.RectAreaLight(0x80b0ff, 4, 1.5, 3.0);
        cool.position.set(2.6, 1.0, 1.8);
        cool.scale.set(2, 2, 2);
        cool.lookAt(0, 0.5, 0);
        cool.rotateZ(0.4);
        scene.add(cool);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x808080, roughness: 0.6 }));
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1;
        scene.add(floor);
        const mats = [
            new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.0 }),
            new THREE.MeshStandardMaterial({ color: 0xd0d0d0, roughness: 0.4, metalness: 1.0 }),
            new THREE.MeshPhysicalMaterial({ color: 0x3060c0, roughness: 0.25, ior: 1.8 }),
        ];
        mats.forEach((m, i) => {
            const s = new THREE.Mesh(new THREE.SphereGeometry(0.8, 64, 32), m);
            s.position.x = (i - 1) * 2.0;
            scene.add(s);
        });
        const cam = new THREE.PerspectiveCamera(45, 800/600, 0.1, 100);
        cam.position.set(0, 1.5, 7); cam.lookAt(0, 0, 0);
        const r = await THREE.WebGLRenderer.create(canvas);
        r.setSize(800, 600);
        r.render(scene, cam);
        await new Promise(rs => requestAnimationFrame(() => rs()));
        document.body.dataset.ready = 'true';
    } catch (e) {
        console.error(e);
        errEl.style.display='block'; errEl.textContent = e?.stack || String(e);
        document.body.dataset.ready = 'error';
    }
})();
</script></body></html>
