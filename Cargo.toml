# Browser tests. `wasm-bindgen-test` is only needed when building for wasm, so
# it is a dev-dependency of that target alone and costs a native build nothing.
# Native only: criterion pulls in rayon, which refuses to build for wasm32 and
# takes the whole browser test suite down with it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = "0.5"
# wgpu's own naga, with the GLSL writer WebGL2 goes through, so
# `tests/shader_validation.rs` can translate every shader variant as the
# browser will — ANGLE rejects what naga's WGSL validator accepts.
naga = { version = "30.0.0", features = ["wgsl-in", "glsl-out"] }

# What the CPU side of a frame costs. Everything in it runs without an adapter,
# so it is a number CI can watch rather than one somebody remembers to take.
[[bench]]
name = "pipeline"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# The WebGL test has to make a canvas: wgpu's GL backend takes its context from
# one, so without a surface there is no adapter to request.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.web-sys]
version = "0.3"
features = ["Window", "Document", "Element", "HtmlCanvasElement"]

