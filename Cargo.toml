[workspace]
members = [
    ".",
    "crates/threers-probe",
    "crates/threers-physics",
    "crates/threers-ocean",
    "crates/threers-animation",
    "crates/threers-connectome",
    "crates/threers-robot-arm",
    "crates/threers-physics-bench",
    "crates/threers-js",
    "crates/threers-py",
    "crates/threers-node",
    "crates/threers-fluid-ios",
]
# `crates/threers-continuum` and `crates/threers-mechanism-tour` build as
# libraries but their tests and examples still call an older shape of their own
# API — builder methods that are now fields, argument lists a version behind.
# They are left out until that is reconciled, so `--all-targets` stays clean.
exclude = ["crates/threers-continuum", "crates/threers-mechanism-tour"]
resolver = "2"

[package]
name = "threers"
version = "0.0.8"
edition = "2021"
# wgpu 30 requires 1.87, and this crate uses `is_multiple_of`, stabilised in the
# same release. Declared so cargo says so up front rather than letting the build
# fail somewhere inside a dependency.
rust-version = "1.87"
authors = ["Eugene Hauptmann"]
description = "Drop-in three.js replacement for Rust and WebAssembly (wgpu) — THREE.* API, scene graph, PBR, post-fx, mesh BVH, CSG, an OpenSCAD front end with a watertight exact-CSG kernel, headless render, and native media codecs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/eugenehp/threers"
homepage = "https://github.com/eugenehp/threers"
documentation = "https://docs.rs/threers"
keywords = ["three-js", "wgpu", "webgpu", "graphics", "wasm"]
categories = ["graphics", "rendering", "wasm", "game-development"]
exclude = [
    # 22 MB of reference scene dumps only the parity harness reads. Note that
    # `src/csg/step_tests.rs` `include_bytes!`s a handful of these, so the
    # published crate builds and runs but `cargo test` inside the tarball does
    # not — the fixtures are not there. Fetch the repo to run that suite.
    "tests/parity/scenes/**",
    # The npm package's material, published separately, and megabytes of built
    # wasm besides.
    "web/**",
    # Sibling crates. The ones with a manifest cargo drops on its own; these are
    # the recovered demos that have none yet, and they are not this crate's.
    "crates/**",
    # Development notes and a reference paper — 2.5 MB that no dependent needs.
    "docs/**",
    "papers/**",
    # Example render output and local tooling.
    "out/**",
    "scripts/**",
    # Two render artifacts that were committed by accident and have been shipping
    # ever since: a path-trace viewport capture and a test video. Together they
    # are 16.9 MB — over half of what went into the 0.0.5 tarball — and no
    # dependent reads either. They are still *tracked*, so this only keeps them
    # out of the package; removing them from history is a separate decision.
    "viewport_path_trace.rtfc",
    "cube.mp4",
]

# docs.rs builds with default features only, which for this crate means most of
# it — USD, CAD, the codecs, the path tracer — would not appear in the published
# documentation at all. The Apple-only features are left out because the
# builders are Linux, and `manifold` and `rlx` because they reach outside Rust.
[package.metadata.docs.rs]
features = [
    "usd",
    "cad",
    "media",
    "planet",
    "raytrace",
    "assembly-check",
    "step",
    "parallel",
    "async",
    "fluid",
]

[lib]
crate-type = ["cdylib", "rlib"]

# Size-tuned release for wasm. NOT `[profile.release]`, because that governs the
# native build too, where this renderer and the path tracer want speed — and
# `opt-level = "z"` there would be a bad trade.
#
# Measured on `mini` + `webgl`, after wasm-bindgen, brotli -q 11 as the browser
# would receive it:
#
#   default release                  5.41 MiB raw   1.089 MiB transferred
#   this profile                     2.86 MiB raw   0.785 MiB transferred
#
# A 28% smaller download, for about a minute of build time instead of twelve
# seconds. `opt-level = "z"` beats `"s"` here (2.86 against 3.17 MiB raw), which
# is not a given — `"z"` disables loop vectorisation and sometimes costs more
# than it saves.
#
# `panic = "immediate-abort"` would take another slice off, but it needs
# `cargo-features` at the top of this manifest, which makes the whole crate
# nightly-only. Not worth it for a published library.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["captions"]
# Subtitles — SRT + WebVTT, on-screen and burned in.
captions = []
# A retained UI: CSS-subset styles, flexbox layout, painting and hit-testing
# (implies captions, for text).
ui = ["captions"]
# Accelerated raycast / shapecast.
mesh-bvh = []
# Path tracer: global illumination, area lights, refraction, DoF; CPU + wgpu-compute.
raytrace = []
# Constructive solid geometry (implies mesh-bvh).
bvh-csg = ["mesh-bvh"]
# `.scad` front end + `Solid` DSL + exact-CSG kernel (implies bvh-csg).
openscad = ["bvh-csg"]
# Optional Manifold kernel behind the OpenSCAD booleans.
manifold = ["dep:manifold-rust", "openscad"]
# Planets, moons, starfields, map generation.
planet = []
# Interactive 2D fluid simulation (Stam's stable fluids on the GPU, as render
# passes only — no compute stage, so it runs on WebGL2 as well as WebGPU).
fluid = []
# Universal Scene Description — `.usda`, `.usdc` and `.usdz`, read and written.
# Pure Rust with no dependencies of its own, so this costs compile time and
# nothing else; it is opt-in because most scenes never touch USD.
usd = []
# Native frame-sequence export via ffmpeg (implies captions).
video = ["captions"]
# Pure-Rust GIF, APNG, VP9/WebM, H.264/MP4, HEVC (wasm-safe).
# The muxers write caption tracks, so this needs `captions` the same way
# `video` does. It is a pure-code feature with no dependencies of its own,
# so this costs compile time and nothing else.
native-codec = ["captions"]
# GIF89a encode and decode (`codec::gif`), and GIF in the animation and video
# exporters. Off, choosing GIF there is an error rather than a missing variant.
gif = ["native-codec"]
# Second renderer on Metal via the Objective-C runtime (macOS/iOS).
metal = []
# CompositorServices + ARKit (implies metal).
visionos = ["metal"]
# In-process VideoToolbox encode + MP4 mux (macOS).
videotoolbox = ["native-codec"]
# rayon-backed CSG/BVH work (native; a no-op on wasm32).
parallel = ["dep:rayon"]
# tokio runtime for callers driving loaders concurrently (native).
async = ["dep:tokio"]
# Tensors ↔ geometry and pixels, graph runner, convolution, mesh smoothing.
rlx = ["dep:rlx"]
# Exact Delaunay + adaptive refinement + Voronoi cell textures.
rlx-geo = ["dep:rlx-geo"]
# NURBS curves/surfaces: derivatives, knots, tessellation.
nurbs = []
# Analytic surface provenance on geometry (implies nurbs).
brep = ["nurbs"]
# Closed-form SSI fast paths in the CSG kernel (implies brep + openscad).
brep-csg = ["brep", "openscad"]
# True B-rep topology, boolean, fillets (implies brep-csg).
brep-kernel = ["brep-csg"]
# STEP AP203/214 import + export (implies brep-kernel).
step = ["brep-kernel"]
# Assembly motion checks (body correspondence, axis recovery, swept volume).
assembly-check = []
# WebGL2 in the browser, through wgpu's GL backend.
#
# WebGPU is still preferred wherever the browser has it; this only widens what
# runs. WebGL2 has no compute shaders and no storage buffers, so the passes that
# need them fall back to their raster or CPU paths — see `docs/webgl.md`.
webgl = ["wgpu/webgl"]
# Trained U-Net denoiser beside the À-Trous filter (native inference).
learned-denoise = ["raytrace"]
learned-denoise-metal = ["learned-denoise"]
learned-denoise-gpu = ["learned-denoise"]

# --- Meta bundles (additive; leaf flags above stay independently usable) ---
# CAD / solid modelling stack.
cad = ["openscad", "nurbs", "brep", "brep-csg", "parallel"]
# Video, captions, and pure-Rust codecs.
media = ["video", "native-codec", "gif", "captions"]
# Path tracing + trained denoise.
gi = ["raytrace", "learned-denoise"]
# Apple-platform backends (inert on other OSes).
apple = ["metal", "videotoolbox"]
# Everything useful for a full native build (implies the bundles above).
full = [
    "cad",
    "media",
    "gi",
    "planet",
    "fluid",
    "usd",
    "rlx",
    "rlx-geo",
    "assembly-check",
    "async",
    "step",
    "brep-kernel",
]
# Browser / wasm kitchen sink — no native-only flags (video, metal, async, …).
# Used by `VARIANT=full web/build.sh` and the npm `threers/full` package entry.
wasm-full = ["captions", "openscad", "native-codec", "gif", "nurbs", "planet", "raytrace", "fluid", "usd"]

[dependencies]
wgpu = "30"
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"
slotmap = "1.0"
web-time = "0.2"
rayon = { version = "1.10", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["rt-multi-thread", "macros"] }
# `gpu` on every target, wasm32 included. It used to be native-only: rlx's GPU
# backend was wgpu 30 while this renderer was wgpu 0.20, and two majors in one
# wasm binary make wasm-bindgen reject the result over duplicate WebGPU enums.
# Both are wgpu 30 now, and `wasm-bindgen` accepts the build.
# 0.2.17, the newest rlx on crates.io that builds: the published 0.2.18
# `rlx-runtime` imports `rlx_ir::NumberFormat`, which the published 0.2.18
# `rlx-ir` does not have. Cargo.lock pins the whole rlx family at 0.2.17
# (`^0.2.17` alone would float `rlx-runtime` up to the broken 0.2.18).
rlx = { version = "0.2.17", optional = true, default-features = false, features = ["cpu", "tensor", "gpu"] }
rlx-geo = { version = "0.2.17", optional = true }
manifold-rust = { version = "0.13", optional = true }

# Native-only deps (winit + env_logger + pollster only make sense outside wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.29"
pollster = "0.3"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    # `ui::canvas`: the 2D canvas painter and its DOM text.
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "DomRect",
    "TextMetrics",
    "Path2d",
    "Node",
    "Performance",
    "console",
    # The fluid's browser shell: pointer events give one id per finger, which
    # is exactly the shape `FluidSim::pointer_down` wants.
    "EventTarget",
    "PointerEvent",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    # `ui::a11y_dom`: the accessibility mirror's focus and activation.
    "Event",
    "FocusEvent",
    "KeyboardEventInit",
]

