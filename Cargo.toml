[package]
name = "threers"
version = "0.0.3"
edition = "2021"
authors = ["Eugene Hauptmann"]
description = "Drop-in three.js replacement for Rust and WebAssembly (wgpu) — THREE.* API, scene graph, PBR, post-fx, mesh BVH, CSG, an OpenSCAD front end with a watertight exact-CSG kernel, headless render, and native media codecs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/eugenehp/threers"
homepage = "https://github.com/eugenehp/threers"
documentation = "https://docs.rs/threers"
keywords = ["three-js", "wgpu", "webgpu", "graphics", "wasm"]
categories = ["graphics", "rendering", "wasm", "game-development"]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "headless_video"
required-features = ["video"]

[[example]]
name = "export_h264"
required-features = ["video"]

[[example]]
name = "export_hevc"
required-features = ["video"]

[[example]]
name = "export_hevc_vt"
required-features = ["video"]

[[example]]
name = "export_vp9"
required-features = ["video"]

[[example]]
name = "export_vp9_alpha"
required-features = ["video"]

[[example]]
name = "export_gif"
required-features = ["video", "native-codec"]

[[example]]
name = "export_apng"
required-features = ["video", "native-codec"]

[[example]]
name = "export_webm_native"
required-features = ["native-codec"]

[features]
default = []
mesh-bvh = []
bvh-csg = ["mesh-bvh"]
# OpenSCAD-style solid modeling: `.scad` front end + `Solid`/`scad!` Rust DSL,
# a watertight exact-CSG kernel (float fallback), mesh import/export, and
# `surface()` heightmaps. Pulls bvh-csg for the float fallback path.
openscad = ["bvh-csg"]
# Native video export: renders a frame sequence and encodes it with the system
# `ffmpeg` (no extra crate deps — the feature just gates the module).
video = []
# From-scratch, pure-Rust media codecs (HEVC, VP9/WebM, APNG, GIF encode/decode,
# bitstream). No external deps and no OS/process/thread use — native and wasm32.
native-codec = []

[dependencies]
wgpu = "0.20"
bytemuck = { version = "1.16", features = ["derive"] }
log = "0.4"
slotmap = "1.0"
web-time = "0.2"

# Native-only deps (winit + env_logger + pollster only make sense outside wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.29"
pollster = "0.3"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
futures-channel = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Performance",
    "console",
]

