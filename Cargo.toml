# Opt-out cfgs for consumers that embed the renderer in their own wasm crate
# (set through RUSTFLAGS, e.g. `--cfg threers_no_js_bindings`); declared here so
# rustc's check-cfg knows them. See src/lib.rs and renderer::upload_ltc.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(threers_no_js_bindings)', 'cfg(threers_no_rect_area_light)'] }

