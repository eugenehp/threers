# Build & publish language packages (multi-arch)

# npm ESM (wasm) — arch-independent
name: release-language-packages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to registries (needs secrets on tag push anyway)'
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  # A tag push publishes; so does a manual run with `publish` ticked.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}

jobs:
  npm-esm:
    name: npm @threers/threers (wasm ESM)
    runs-on: ubuntu-latest
    # setup-node's .npmrc reads the token from here, and since v7 it no longer
    # exports a placeholder, so every npm command in the job needs it set.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # build.sh drives wasm-bindgen directly (not wasm-pack), and the CLI has to
      # match the wasm-bindgen crate in Cargo.lock exactly.
      - name: Install wasm-bindgen-cli
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$v" --locked
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Only the wasm package: the default `language` target also builds the host
      # napi addon and PyPI wheel, which have their own jobs (and no maturin here).
      - name: Build npm ESM
        run: TARGETS=npm-esm ./scripts/release-all.sh build
      - name: Pack npm ESM
        working-directory: crates/threers-js
        run: npm pack
      - name: Publish
        if: env.PUBLISH == 'true'
        working-directory: crates/threers-js
        run: ../../scripts/npm-publish-once.sh

  napi:
    name: threers-node (${{ matrix.settings.target }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled on Apple silicon: no macos-13 runner ever picks the job
          # up, it sits queued for 24 hours and cancels, and the publish job that
          # needs the whole matrix is skipped with it.
          - host: macos-14
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install deps
        working-directory: crates/threers-node
        run: npm ci || npm install
      - name: Build native addon
        working-directory: crates/threers-node
        run: >
          npx napi build --platform --release
          --target ${{ matrix.settings.target }}
          --features headless,physics,animation
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.settings.target }}
          path: |
            crates/threers-node/*.node
            crates/threers-node/npm/
          if-no-files-found: error

  napi-publish:
    name: Publish threers-node + platform packages
    needs: napi
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: napi-*
          merge-multiple: false
      - name: Install + collect artifacts
        working-directory: crates/threers-node
        run: |
          npm ci || npm install
          # Copy built .node files next to platform package stubs.
          mkdir -p npm/darwin-arm64 npm/darwin-x64 npm/linux-x64-gnu npm/linux-arm64-gnu npm/win32-x64-msvc
          find ../../artifacts -name '*.node' -print0 | while IFS= read -r -d '' f; do
            base=$(basename "$f")
            case "$base" in
              *darwin-arm64*) cp "$f" npm/darwin-arm64/ ;;
              *darwin-x64*) cp "$f" npm/darwin-x64/ ;;
              *linux-x64-gnu*) cp "$f" npm/linux-x64-gnu/ ;;
              *linux-arm64-gnu*) cp "$f" npm/linux-arm64-gnu/ ;;
              *win32-x64-msvc*) cp "$f" npm/win32-x64-msvc/ ;;
            esac
          done
          ls -la npm/* || true
      # Every platform package before the parent that lists them as optional
      # dependencies, and none missing: a parent published without one installs
      # on that platform and then cannot load. A rerun skips what is already up.
      - name: Publish platform packages, then threers-node
        working-directory: crates/threers-node
        run: |
          for d in npm/*/; do
            compgen -G "$d*.node" > /dev/null || { echo "::error::no .node in $d"; exit 1; }
            (cd "$d" && ../../../../scripts/npm-publish-once.sh)
          done
          ../../scripts/npm-publish-once.sh

  pypi:
    name: PyPI wheels (${{ matrix.os }} / ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled on Apple silicon (abi3 wheel); see the napi matrix.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        working-directory: crates/threers-py
        run: >
          maturin build --release
          --features headless,physics,animation
          --target ${{ matrix.target }}
          -o dist
      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: crates/threers-py/dist/*.whl

  pypi-publish:
    name: Publish PyPI wheels
    needs: pypi
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: wheels
          pattern: wheels-*
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          skip-existing: true
