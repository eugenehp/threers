<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/web/viewer-theme.css" />
<title>threers · NEMA 17 stepper (wasm + WebGPU)</title>
<style>
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #main { position: relative; height: 100%; }
  #canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; left: 16px; top: 14px; }
  #title { font-size: 15px; font-weight: 600; color: var(--title); }
  #stats { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #spinbox { position: absolute; right: 16px; top: 14px; display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 9px; cursor: pointer; }
  #panel { position: absolute; right: 16px; top: 52px; width: 190px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; backdrop-filter: blur(4px); }
  #panel label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  #panel label b { color: var(--fg); }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  #err { position: absolute; inset: 0; display: none; place-items: center; padding: 24px;
    text-align: center; color: #ff8a8a; font-size: 14px; }
</style>
</head>
<body>
<main id="main">
  <canvas id="canvas"></canvas>
  <div id="hud"><div id="title">NEMA 17 stepper motor</div><div id="stats"></div></div>
  <label id="spinbox"><input type="checkbox" id="spin" checked> slow rotation</label>
  <div id="panel">
    <label>explode <b id="v-ex">0%</b></label>
    <input id="explode" type="range" min="0" max="100" value="0">
  </div>
  <div id="err"></div>
  <button id="theme-btn"></button>
  </main>

<script type="module">
import THREE, { initThreers, Vector3, Euler } from '/web/threejs-shim.js';
import { nema17_scene } from '/web/pkg/threers.js';
import { initTheme } from '/web/viewer-theme.js';

const $ = (s) => document.querySelector(s);
const canvas = $('#canvas'), errEl = $('#err');

try {
  await initThreers({ module_or_path: '/web/pkg/threers_bg.wasm' });

  // Supersample the canvas (the browser WebGPU renderer has no MSAA): render at a
  // higher backing resolution and let the element downscale it -> smooth edges.
  function resize() {
    const cw = canvas.parentElement.clientWidth, ch = canvas.parentElement.clientHeight;
    const base = Math.min(devicePixelRatio || 1, 2), ss = 1, cap = 3400;
    let w = cw * base * ss, h = ch * base * ss;
    const k = Math.min(1, cap / Math.max(w, h));
    w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    canvas.width = w; canvas.height = h; return { w, h };
  }
  let { w, h } = resize();

  const renderer = await THREE.WebGLRenderer.create(canvas);
  renderer._w?.setMsaa?.(4); // hardware 4× MSAA on the opaque pass
  renderer.setSize(w, h);
  const camera = new THREE.PerspectiveCamera(40, w / h, 0.5, 4000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x14161c);
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const d1 = new THREE.DirectionalLight(0xffffff, 2.8); d1.position.set(-5, -8, 7); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0xffffff, 0.9); d2.position.set(6, 5, -3); scene.add(d2);
  initTheme((_, bg) => { scene.background = new THREE.Color(bg); });

  const meshes = [], cents = [];
  const ps = nema17_scene();
  let tris = 0, mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = 0; i < ps.count; i++) {
    const pos = ps.positions(i), nrm = ps.normals(i), c = ps.color(i);
    tris += pos.length / 9;
    let sx = 0, sy = 0, sz = 0;
    for (let k = 0; k < pos.length; k += 3) {
      sx += pos[k]; sy += pos[k+1]; sz += pos[k+2];
      for (let a = 0; a < 3; a++) { mn[a] = Math.min(mn[a], pos[k+a]); mx[a] = Math.max(mx[a], pos[k+a]); }
    }
    const nv = pos.length / 3;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    const hex = (Math.round(c[0]*255) << 16) | (Math.round(c[1]*255) << 8) | Math.round(c[2]*255);
    const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.4, metalness: 0.4 }));
    scene.add(mesh);
    if (mesh._handle) { meshes.push(mesh); cents.push([sx/nv, sy/nv, sz/nv]); }
  }
  const center = [(mn[0]+mx[0])/2, (mn[1]+mx[1])/2, (mn[2]+mx[2])/2];
  const radius = Math.hypot(mx[0]-mn[0], mx[1]-mn[1], mx[2]-mn[2]) / 2;
  $('#stats').textContent = `${ps.count} parts · ${tris.toLocaleString()} triangles`;

  camera.up = new Vector3(0, 0, 1);
  const dist = radius * 2.4;
  camera.position.set(center[0] + dist*0.9, center[1] - dist*0.85, center[2] + dist*0.45);
  camera.lookAt(center[0], center[1], center[2]);
  controls?.resetFromCamera?.();

  addEventListener('resize', () => { ({ w, h } = resize()); renderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix?.(); });

  const spin = $('#spin'), explode = $('#explode');
  let angle = 0;
  // Compose spin (rotate about the assembly centre by `angle`) with an exploded
  // view (translate each part outward from the centre by `factor`). setTransform is
  // T(pos)·R(quat), and the part geometry is baked at its world position p, so the
  // per-part pos = Rz·(E − c) + c, where E is the explode offset.
  function applyTransforms() {
    if (!meshes.length) return;
    const f = (+explode.value) / 100 * 2.2;
    const ca = Math.cos(angle), sa = Math.sin(angle);
    for (let i = 0; i < meshes.length; i++) {
      const ct = cents[i];
      const ex = (ct[0] - center[0]) * f, ey = (ct[1] - center[1]) * f, ez = (ct[2] - center[2]) * f;
      const vx = ex - center[0], vy = ey - center[1], vz = ez - center[2];
      const px = ca * vx - sa * vy + center[0], py = sa * vx + ca * vy + center[1], pz = vz + center[2];
      // Set the JS mesh transform; the renderer's _syncTransforms pushes it to wasm
      // (a direct scene._w.setTransform would be overwritten each frame).
      meshes[i].position.set(px, py, pz);
      meshes[i].rotation.set(0, 0, angle);
    }
  }
  explode.addEventListener('input', () => { $('#v-ex').textContent = explode.value + '%'; applyTransforms(); });

  function loop() {
    requestAnimationFrame(loop);
    if (spin.checked) { angle = (angle + 0.006) % (Math.PI * 2); applyTransforms(); }
    renderer.render(scene, camera);
  }
  applyTransforms();
  loop();
  void controls;
} catch (e) {
  errEl.style.display = 'grid';
  errEl.innerHTML = 'Failed to start: ' + (e?.message || e) +
    '<br><br>Needs a WebGPU browser (Chrome/Edge 113+). Serve over http, not file://.';
  console.error(e);
}
</script>
</body>
</html>
