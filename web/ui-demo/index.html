addEventListener("unhandledrejection", (e) => report(`rejection: ${e.reason}`));
for (const t of ["click", "dblclick", "mousedown"]) document.addEventListener(t, (e) => report(`${t} on ${e.target.id || e.target.tagName}`), { capture: true });
ime.addEventListener("focus", () => report("input focus"));
ime.addEventListener("blur", (e) => report(`input blur to ${e.relatedTarget?.id || e.relatedTarget?.tagName || "nothing"}`));
// Who moves focus to the canvas, and when the field's focus changes.
if (debugging) {
  const focus = canvas.focus.bind(canvas);
  canvas.focus = (...a) => {
    if (document.activeElement === ime) report(`canvas.focus from ${(new Error().stack || "").split("\n").slice(1, 5).map((l) => l.trim().slice(0, 60)).join(" < ")}`);
    return focus(...a);
  };
  let wanted = null;
  setInterval(() => {
    const w = demo.wants_text();
    if (w !== wanted) { report(`wants_text ${wanted} -> ${w}`); wanted = w; }
  }, 50);
}
// `?beacon`: every two seconds, how the frames went, sent to the server as a
// request it logs (and answers 404), for measuring on a phone.
if (new URLSearchParams(location.search).has("beacon")) {
  let gaps = [];
  let last = performance.now();
  const watch = (t) => { gaps.push(t - last); last = t; requestAnimationFrame(watch); };
  requestAnimationFrame(watch);
  setInterval(() => {
    const t = JSON.parse(demo.take_timings());
    const q = (v, p) => (v.length ? v.slice().sort((a, b) => a - b)[Math.min(v.length - 1, Math.floor(p * v.length))] : 0).toFixed(1);
    const col = (i) => t.frames.map((f) => f[i]);
    const report = {
      n: t.frames.length,
      app: [q(col(0), 0.5), q(col(0), 0.9), q(col(0), 1)],
      paint: [q(col(1), 0.5), q(col(1), 0.9), q(col(1), 1)],
      mirror: [q(col(2), 0.5), q(col(2), 0.9), q(col(2), 1)],
      gaps: [q(gaps, 0.5), q(gaps, 0.9), q(gaps, 0.99), gaps.filter((g) => g > 25).length, gaps.length],
      dpr, w, h,
    };
    gaps = [];
    if (report.n > 0) fetch(`/beacon?${encodeURIComponent(JSON.stringify(report))}`).catch(() => {});
  }, 2000);
}
// Nothing is drawn while nothing happens: a waiting tooltip or long press
// keeps `frame` asking for more until it has fired.
kick();
