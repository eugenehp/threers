<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kirigami — threers</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #08090d;
            color: #e6e8ee;
            font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        header {
            display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
            padding: 18px 24px 12px;
            border-bottom: 1px solid #1e2129;
        }
        h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
        h1 .tag { color: #7d879c; font-weight: 400; }
        #status { color: #7d879c; font-size: 12px; }
        nav { margin-left: auto; display: flex; gap: 14px; }
        nav a { color: #6ea8fe; text-decoration: none; font-size: 13px; }
        nav a:hover { text-decoration: underline; }
        main { padding: 20px 24px 40px; max-width: 1200px; margin: 0 auto; }
        .intro { color: #97a0b3; max-width: 82ch; margin: 0 0 16px; font-size: 13px; }
        .intro code { color: #cfd6e6; background: #14161d; padding: 1px 5px; border-radius: 4px; }
        canvas { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 10px; background: #05060a; }
        .controls {
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            margin: 14px 0 8px;
        }
        button, select {
            font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px;
            border: 1px solid #2a2f3c; background: #161a23; color: #e6e8ee; cursor: pointer;
        }
        button:hover, select:hover { background: #1d2230; }
        button.active { border-color: #6ea8fe; background: #1a2740; }
        #net {
            margin-top: 18px; background: #101218; border: 1px solid #1e2129;
            border-radius: 10px; padding: 12px; overflow: auto; max-height: 280px;
        }
        #net svg { display: block; max-width: 100%; height: auto; background: #0b0d12; }
        #err { color: #ff8080; white-space: pre-wrap; font-size: 12px; margin-top: 12px; }
    </style>
</head>
<body>
    <header>
        <h1>threers <span class="tag">· kirigami corrugations</span></h1>
        <span id="status">loading wasm…</span>
        <nav>
            <a href="./index.html">all examples</a>
        </nav>
    </header>
    <main>
        <p class="intro">
            Kirigami Expanded Miura plate lattices from Parra Rubio et al. (ASME 2023) —
            pads, inclined walls, custom curvature, discrete origami cells, and a developed
            crease net. Same generator as <code>cargo run --example kirigami</code>.
        </p>
        <canvas id="c" width="1280" height="720"></canvas>
        <div class="controls" id="controls"></div>
        <div id="net"></div>
        <div id="err"></div>
    </main>
    <script type="module" src="./kirigami-demo.js"></script>
</body>
</html>
